name: publish

# Publica a npm cuando se empuja un tag de versión. `npm version patch` crea el
# tag; `git push --follow-tags` dispara esto.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # para crear el release y subirle el .mcpb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Los tests no abren un browser, solo ejercitan el guard y la
      # normalización, así que no vale la pena bajar Chromium en CI.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm test

      - name: Verificar que las versiones coincidan
        run: node scripts/check-version.mjs

      # Fallar aquí con un mensaje claro es mejor que un 403 de npm al final,
      # después de haber corrido todo lo demás.
      - name: Comprobar que la versión no esté publicada
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "bg-mcp@$version" version > /dev/null 2>&1; then
            echo "bg-mcp@$version ya está en npm. Sube la versión con 'npm version patch' y empuja el tag." >&2
            exit 1
          fi
          echo "bg-mcp@$version todavía no está publicado."

      # prepublishOnly compila y genera el npm-shrinkwrap.json del tarball.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # El .mcpb es lo que Claude Desktop instala de un clic, así que va colgado
      # del release para que se pueda descargar sin clonar ni compilar nada.
      - name: Adjuntar el bundle de Claude Desktop al release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run bundle
          gh release create "$GITHUB_REF_NAME" build/bg-mcp.mcpb --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" build/bg-mcp.mcpb --clobber
