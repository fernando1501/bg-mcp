name: publish

# Publica a npm cuando se empuja un tag de versión. `npm version patch` crea el
# tag; `git push --follow-tags` dispara esto.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Los tests no abren un browser, solo ejercitan el guard y la
      # normalización, así que no vale la pena bajar Chromium en CI.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm test

      - name: Verificar que las versiones coincidan
        run: node scripts/check-version.mjs

      # prepublishOnly compila y genera el npm-shrinkwrap.json del tarball.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
